[project]
name = "mcp-gateway"
version = "0.0.0"
description = "A small, measured security gateway for MCP servers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio==4.15.1",
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "starlette==1.10.0",
    "tokenizers==0.23.3",
    "typer==0.27.3",
    "uvicorn==0.54.0",
]

[project.scripts]
mcp-gateway = "mcp_gateway.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.0",
    "pyright==1.1.406",
    "types-pyyaml==6.0.12.20250915",
    "mutmut==3.8.0",
    "pytest-timeout==2.4.0",
    "onnx==1.23.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ARG", "RUF"]
ignore = ["S101"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that hangs (a task group that never finishes, a missing close) fails
# instead of stalling the run or CI.
timeout = 30

[tool.mutmut]
# Every surviving mutant is a behaviour the tests don't pin down. The CLI is
# thin wiring and is left out.
source_paths = ["src/mcp_gateway/"]
do_not_mutate = ["src/mcp_gateway/cli.py", "src/mcp_gateway/__init__.py"]
pytest_add_cli_args_test_selection = ["tests/"]
