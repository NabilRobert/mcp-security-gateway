name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans every commit, not only the last one.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      # The exact versions in uv.lock. --locked fails if uv.lock no longer
      # matches pyproject.toml (--frozen would install the stale lock without
      # a word); the steps after it use --frozen so nothing re-locks in CI.
      - run: uv sync --locked --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright
      # No network and no model: the tests use an in-memory upstream. The
      # real filesystem-server test skips here (the harness isn't checked out).
      - run: uv run --frozen pytest -q
      # The exceptions, each a single value shape in named files, are in .gitleaks.toml.
      - name: Install gitleaks, checked against its published checksum
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${archive}$" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - run: gitleaks git --no-banner --redact .
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Builds the image and runs it through deploy/compose.yaml on throwaway networks.
      - run: deploy/smoke-test.sh
