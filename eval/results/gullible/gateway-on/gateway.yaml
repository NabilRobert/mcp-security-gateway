upstreams:
  attack-files:
    transport: stdio
    command: <workspace>/mcp-gateway/.venv/bin/python
    args:
    - -m
    - agent_eval.fs_server
    - <workspace>/agent-eval-harness-gateway/suites/fixtures/acme-shop-attacks
    cwd: <workspace>/agent-eval-harness-gateway
    per_session: true
callers:
  harness:
    key_sha256: 2de19270facce43f58d8dc35e6b3a7dd4e3eeac404deb5ecf18d09746adbda93
    policy: measure
policies:
  measure:
    routes:
      attack-files:
        tools:
          read_file: {}
          read_text_file: {}
          read_media_file: {}
          read_multiple_files: {}
          list_directory: {}
          list_directory_with_sizes: {}
          directory_tree: {}
          search_files: {}
          get_file_info: {}
          list_allowed_directories: {}
          write_file: {}
          edit_file: {}
          create_directory: {}
          move_file: {}
detector:
  rules: true
  model:
    dir: <workspace>/mcp-gateway/models/protectai-deberta-v3-base-prompt-injection-v2/90c9989b1a342275dd0d1a95aad283c04e075671
    threshold: 0.999
    timeout_s: 2.0
audit:
  path: <workspace>/mcp-gateway/eval/results/gullible/gateway-on/audit.jsonl
  fsync: true
