upstreams:
  attack-files:
    transport: stdio
    command: <workspace>/mcp-gateway/.venv/bin/python
    args:
    - -m
    - agent_eval.fs_server
    - <workspace>/agent-eval-harness-gateway/suites/fixtures/acme-shop-attacks
    cwd: <workspace>/agent-eval-harness-gateway
    per_session: true
callers:
  harness:
    key_sha256: 0dca4007ea659006a14cfa13eff774fd6eeb01458ace84dc71d8f42b3d570050
    policy: measure
policies:
  measure:
    routes:
      attack-files:
        tools:
          read_file: {}
          read_text_file: {}
          read_media_file: {}
          read_multiple_files: {}
          list_directory: {}
          list_directory_with_sizes: {}
          directory_tree: {}
          search_files: {}
          get_file_info: {}
          list_allowed_directories: {}
          write_file: {}
          edit_file: {}
          create_directory: {}
          move_file: {}
detector:
  rules: false
audit:
  path: <workspace>/mcp-gateway/eval/results/gullible/gateway-off/audit.jsonl
  fsync: true
