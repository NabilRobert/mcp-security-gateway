upstreams:
  attack-files:
    transport: stdio
    command: <workspace>/mcp-gateway/.venv/bin/python
    args:
    - -m
    - agent_eval.fs_server
    - <workspace>/agent-eval-harness-gateway/suites/fixtures/acme-shop-attacks
    cwd: <workspace>/agent-eval-harness-gateway
    per_session: true
callers:
  harness:
    key_sha256: eb1eaff209aaf917e7e7c9080b6d793e949666c85155155d7830ea67b058e0a3
    policy: measure
policies:
  measure:
    routes:
      attack-files:
        tools:
          read_file: {}
          read_text_file: {}
          read_media_file: {}
          read_multiple_files: {}
          list_directory: {}
          list_directory_with_sizes: {}
          directory_tree: {}
          search_files: {}
          get_file_info: {}
          list_allowed_directories: {}
detector:
  rules: false
audit:
  path: <workspace>/mcp-gateway/eval/results/gullible/policy-only/audit.jsonl
  fsync: true
